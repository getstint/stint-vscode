name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: marketplaces
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: bun run check
      - run: bunx vsce package --no-dependencies --out stint.vsix
      - name: Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          test -n "$VSCE_PAT" || { echo "VSCE_PAT is not set"; exit 1; }
          bunx vsce publish --packagePath stint.vsix --pat "$VSCE_PAT" < /dev/null
      - name: Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          test -n "$OVSX_PAT" || { echo "OVSX_PAT is not set"; exit 1; }
          bunx ovsx publish stint.vsix --pat "$OVSX_PAT" < /dev/null
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" stint.vsix --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag
